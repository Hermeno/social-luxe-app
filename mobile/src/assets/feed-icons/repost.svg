<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Reconstruído por medição do `repeat-16.svg`: o original é um contorno
       cheio de parede 1.25, e o que se guarda aqui é o esqueleto dele com o
       traço 2 da família.

       A seta abria 95.6°, e os braços chegavam a ±3.85 do ápice — era a orelha
       de baixo, e não o corpo, que definia a altura do ícone (o anel acabava em
       18.02 de tinta, a seta em 21.88). Lia-se grande sem ter desenho que o
       justificasse. Agora abre 65°, com o mesmo comprimento de braço: fecha
       sobre si em vez de se espalhar.

       Os 19.75 de altura não mudaram — o que a seta deixou de puxar, o anel
       passou a dar (13.90 -> 14.96). O raio fica em 4.21, circular; o que
       estica é o troço recto da parede. -->
  <path d="M5.86 17.96A4.21 4.21 0 0 1 3.0 13.87V7.33A4.21 4.21 0 0 1 7.21 3.12H16.79A4.21 4.21 0 0 1 21.0 7.33V13.87A4.21 4.21 0 0 1 16.79 18.08H10.26"/>
  <path d="M14.65 15.29L10.26 18.081042036596514L14.65 20.88"/>
</svg>
