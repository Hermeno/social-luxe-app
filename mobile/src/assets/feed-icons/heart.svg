<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Coração de contorno fornecido pelo utilizador, numa caixa de 15.
       O desenho não foi tocado: o contorno faz parte da forma preenchida, e não
       é um traço — por isso aqui não há `stroke`, e a espessura da parede (2
       unidades, medida) é a que o resto da família passou a usar.

       Da caixa de 15 para a grelha de 24 por escala uniforme 4/3 e deslocação
       (2, 0.75), incorporadas nos números porque o gerador não aceita
       `transform`. Escala uniforme + translação preservam a forma ao ponto.

       Os dois valores não são escolhidos: 4/3 põe a tinta nos 20 de largura que
       a margem de 2 permite — a mesma caixa dos outros ícones depois do traço
       passar a 2 — e 0.75 centra a tinta em y=12, o centro que `chat-outline`,
       `repost` e `circle` já tinham. Antes estava em 12.625 e lia-se meio ponto
       mais baixo que os vizinhos na mesma fila. -->
