<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21">
  <title>heart</title>
  <!-- `heart-2.svg`, o desenho da Luxey, tal como veio: as curvas são as do
       ficheiro e não lhes toquei. O que está afinado é a espessura, e é a
       única coisa que aqui é minha — o original não declarava `stroke-width`
       e o defeito do SVG é 1, fino de mais depois do reenquadramento.
       1.216 dá 1.70px numa caixa de 28, que é a espessura da fila inteira. -->
  <path fill="none" stroke="currentColor" stroke-width="1.216" stroke-linecap="round" stroke-linejoin="round"
        d="M10.5 6.5c.5-2.5 4.343-2.657 6-1c1.603 1.603 1.5 4.334 0 6l-6 6l-6-6a4.243 4.243 0 0 1 0-6c1.55-1.55 5.5-1.5 6 1"/>
</svg>
